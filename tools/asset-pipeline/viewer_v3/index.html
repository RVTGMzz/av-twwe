<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aevoria Trainer Viewer</title>
<style>
  :root { --bg:#14161f; --panel:#1d2030; --line:#2e3348; --text:#e6e8f2; --muted:#9aa0bb; --accent:#3fc8e6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .status { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 44px); }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:12px 14px; overflow:auto; }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:0 0 10px; padding:8px 10px; }
  legend { color:var(--muted); padding:0 4px; }
  label { display:flex; gap:6px; align-items:center; margin:3px 0; }
  select, input[type=range] { width:100%; }
  select { background:#11131b; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .grid3 button, .row button { background:#11131b; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 0; cursor:pointer; }
  .grid3 button.on, .row button.on { border-color:var(--accent); color:var(--accent); }
  .grid3 .c { visibility:hidden; }
  .row { display:flex; gap:6px; } .row button { flex:1; }
  .layers { display:grid; grid-template-columns:1fr 1fr; }
  .stage { padding:14px; overflow:auto; }
  canvas { image-rendering: pixelated; border:1px solid var(--line); display:block; max-width:100%; }
  #info { color:var(--muted); margin-top:8px; white-space:pre-wrap; font-family: ui-monospace, monospace; font-size:12px; }
  .note { color:#ffcf6a; font-size:12px; margin-top:6px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header><h1>Aevoria Trainer V3 Viewer</h1><span class="status" id="status"></span></header>
<main>
<aside>
  <fieldset><legend>Nhân vật</legend>
    <div class="row" id="gender"></div>
  </fieldset>
  <fieldset><legend>Animation</legend>
    <div class="row" id="anim"></div>
    <label>Tốc độ <input type="range" id="speed" min="0.1" max="2" step="0.05" value="1"><span id="speedv">1.00×</span></label>
    <div class="row"><button id="play">Dừng</button><button id="step">Khung ▸</button></div>
  </fieldset>
  <fieldset><legend>Hướng</legend>
    <div class="grid3" id="dirs"></div>
    <label><input type="checkbox" id="all8"> Hiện cả 8 hướng</label>
  </fieldset>
  <fieldset><legend>Hiển thị</legend>
    <label>Zoom <input type="range" id="zoom" min="1" max="8" step="1" value="4"></label>
    <label>Nền <select id="bgsel"><option value="#14161c">Tối</option><option value="#4a7046">Cỏ</option><option value="#e9e4d6">Sáng</option><option value="checker">Ô caro</option></select></label>
    <label><input type="checkbox" id="pivot"> Pivot (điểm chạm đất)</label>
    <label><input type="checkbox" id="full" checked> Dùng lớp phần bị che (*_full)</label>
  </fieldset>
  <fieldset><legend>Lớp (bật/tắt để thử thay đồ)</legend>
    <div class="layers" id="layers"></div>
    <div class="row" style="margin-top:6px"><button id="allOn">Bật hết</button><button id="gearOff">Bỏ đồ đeo</button></div>
  </fieldset>
</aside>
<section class="stage">
  <canvas id="cv"></canvas>
  <div id="info"></div>
  <div class="note" id="note"></div>
</section>
</main>
<script src="data.js"></script>
<script src="viewer.js"></script>
</body>
</html>
